project:
  type: website
  output-dir: docs
  resources: /CNAME

# Perfil por defecto (español) para que `quarto preview` muestre menús y pie
profile:
  default: es

# Idioma principal del sitio (babelquarto genera la versión inglesa en /en/)
lang: es

babelquarto:
  mainlanguage: es
  languages: [en]
  languagelinks: navbar
  languagecodes:
    - name: es
      text: "ES"
    - name: en
      text: "EN"

# Traducciones de los metadatos del sitio para la versión inglesa
title-en: "Fernando Rayón Viña"
description-en: "My personal webpage"

website:
  site-url: https://rayonvina.rbind.io
  favicon: assets/images/icon_FRV_white.png
  title: "Fernando Rayón Viña"
  description: "Mi página web personal"
  page-navigation: true
  back-to-top-navigation: true
  twitter-card: true
  google-analytics: 
    tracking-id: "G-F1EM001LSQ"
    storage: none
    anonymize-ip: true
    version: 4
  navbar:
    logo: assets/images/icon_FRV_white.png
    background: primary
    pinned: true
    search: true
    tools:
      - icon: github
        href: https://github.com/RayonVina
    # Los menús (navbar: right) y el pie de página (page-footer) se definen
    # en los perfiles de idioma: _quarto-es.yml y _quarto-en.yml

format:
  html:
    theme: assets/frv-theme.scss
    toc: true
    code-link: true
    pagetitle: "{{< meta title >}} | Fernando Rayón Viña"
    # Selector de idioma ES/EN entre el icono de GitHub y la lupa
    include-after-body: assets/language-switcher.html
