# Freeze computed outputs
execute: 
  freeze: true

# Enable banner style title blocks
title-block-banner: true

# Enable CC licence appendix
license: "CC BY-SA"

# Default for table of contents
toc: true
# toc-title: se omite para que Quarto use el ##### Título traducido de cada idioma
toc-depth: 2
toc-location: left

# Default fields for citation
citation: true
appendix-cite-as: display

# Enable comments
comments: 
  utterances:
    repo: RayonVina/rayonvina
    issue-term: title
    theme: boxy-light
    label: "Comments:"
